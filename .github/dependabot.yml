# Destination: .github/dependabot.yml
# Keeps pinned action SHAs, base images and Python deps current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly